<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cleaveGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="cleaveGlow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="cleaveBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Rounded square plate -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#cleaveGrad)"/>

  <!-- Top half of cleaved 'C' -->
  <path
    d="M44 22.5
       C40.5 18.5, 35.5 16.5, 30.5 17.2
       C24 18.1, 18.5 23, 17.4 29.4
       L23.6 29.4
       C24.6 26, 27.7 23.3, 31.3 22.8
       C34.6 22.4, 37.9 23.6, 40 25.9 Z"
    fill="white" filter="url(#cleaveBlur)"/>

  <!-- Bottom half of cleaved 'C' (offset to show the slice) -->
  <path
    d="M17.6 33.4
       C18.5 40.1, 24.2 45.4, 31 46.1
       C36 46.6, 40.9 44.7, 44.4 40.8
       L40.4 37.7
       C38.2 40.2, 34.9 41.6, 31.5 41.2
       C27.7 40.8, 24.5 38.1, 23.6 34.6 Z"
    fill="white" filter="url(#cleaveBlur)"/>

  <!-- The cleave: diagonal accent slash -->
  <path
    d="M50 14 L14 50"
    stroke="url(#cleaveGlow)"
    stroke-width="2.4"
    stroke-linecap="round"
    opacity="0.95"/>
  <path
    d="M50 14 L14 50"
    stroke="white"
    stroke-width="0.9"
    stroke-linecap="round"
    opacity="0.7"/>
</svg>
